name: Build viogpu3d ARM64 Driver

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      mesa_repo:
        description: 'Mesa Git repository URL'
        required: true
        default: 'https://gitlab.freedesktop.org/miles.buckton/mesa'
      mesa_ref:
        description: 'Mesa branch, tag or commit SHA to build'
        required: true
        default: 'main'
      publish:
        description: 'Publish a GitHub release'
        type: boolean
        default: true

permissions:
  contents: read

env:
  DEFAULT_MESA_REPO: 'https://gitlab.freedesktop.org/miles.buckton/mesa'
  DEFAULT_MESA_REF: 'main'
  # Releases are published only from a manual run with publish enabled;
  # pull_request runs only upload the build artifact.
  PUBLISH: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true' }}

jobs:
  build-arm64:
    name: Build viogpu3d (Win11 ARM64)
    runs-on: windows-2022
    permissions:
      contents: write

    steps:
      - name: Checkout yttrium-virtio-gpu
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Meson and Ninja
        shell: pwsh
        run: |
          pip install --upgrade meson ninja mako pyyaml packaging

      - name: Setup MSVC developer environment (ARM64 cross-compile)
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $before = @{}
          Get-ChildItem env: | ForEach-Object { $before[$_.Name] = $_.Value }
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvarsall.bat`" x64_arm64 >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$' -and $before[$matches[1]] -ne $matches[2]) {
              $name = if ($matches[1] -ieq 'Path') { 'PATH' } else { $matches[1] }
              "$name=$($matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Append
            }
          }

      - name: Install winflexbison
        shell: pwsh
        run: |
          choco install winflexbison3 -y --no-progress
          "C:\ProgramData\chocolatey\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Install Windows Driver Kit (WDK)
        shell: pwsh
        run: |
          # windows-2022 images ship a WDK matching their SDK; only install when absent
          # so the WDK and SDK versions are not mixed.
          $wdkBin = "C:\Program Files (x86)\Windows Kits\10\bin"
          $hasWdk = Get-ChildItem $wdkBin -Directory -ErrorAction SilentlyContinue |
            Where-Object { (Test-Path (Join-Path $_.FullName "x64\inf2cat.exe")) -or (Test-Path (Join-Path $_.FullName "x86\inf2cat.exe")) }
          if ($hasWdk) {
            Write-Host "WDK already installed: $($hasWdk.Name -join ', ')"
          } else {
            choco install windowsdriverkit10 -y --no-progress
          }

      - name: Discover Windows SDK and WDK headers
        shell: pwsh
        run: |
          $sdkInclude = "C:\Program Files (x86)\Windows Kits\10\Include"
          $sdkVersions = Get-ChildItem $sdkInclude -Directory | Sort-Object Name -Descending

          foreach ($ver in $sdkVersions) {
            $umPath = Join-Path $ver.FullName "um"
            $sharedPath = Join-Path $ver.FullName "shared"
            $d3d10Header = Join-Path $umPath "d3d10umddi.h"
            $d3dkmHeader = Join-Path $sharedPath "d3dkmddi.h"

            if ((Test-Path $d3d10Header) -and (Test-Path $d3dkmHeader)) {
              Write-Host "Found d3d10umddi.h in: $umPath"
              Write-Host "Found d3dkmddi.h in: $sharedPath"
              "WDK_INCLUDE=$umPath;$sharedPath" | Out-File -FilePath $env:GITHUB_ENV -Append
              exit 0
            }
          }

          Write-Error "Could not find required d3d10umddi.h or d3dkmddi.h in $sdkInclude"
          exit 1

      - name: Clone Mesa
        shell: pwsh
        env:
          INPUT_MESA_REPO: ${{ github.event.inputs.mesa_repo }}
          INPUT_MESA_REF: ${{ github.event.inputs.mesa_ref }}
        run: |
          $repo = if ($env:INPUT_MESA_REPO) { $env:INPUT_MESA_REPO } else { $env:DEFAULT_MESA_REPO }
          $ref = if ($env:INPUT_MESA_REF) { $env:INPUT_MESA_REF } else { $env:DEFAULT_MESA_REF }
          # fetch by ref so branches, tags and commit SHAs all work
          git init -q mesa-src
          git -C mesa-src remote add origin $repo
          git -C mesa-src fetch --depth 1 origin $ref
          if ($LASTEXITCODE -ne 0) { throw "Failed to fetch Mesa $ref from $repo" }
          git -C mesa-src checkout -q FETCH_HEAD
          $mesaSha = git -C mesa-src rev-parse HEAD
          "MESA_REPO=$repo" | Out-File -FilePath $env:GITHUB_ENV -Append
          "MESA_REF=$ref" | Out-File -FilePath $env:GITHUB_ENV -Append
          "MESA_SHA=$mesaSha" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Configure and build Mesa (ARM64)
        shell: pwsh
        env:
          INCLUDE: ${{ env.WDK_INCLUDE }};${{ env.INCLUDE }}
        run: |
          $mesaPrefix = Join-Path $env:GITHUB_WORKSPACE "mesa_prefix_arm64"
          New-Item -ItemType Directory -Path $mesaPrefix -Force | Out-Null
          "MESA_PREFIX_ARM64=$mesaPrefix" | Out-File -FilePath $env:GITHUB_ENV -Append

          cd mesa-src
          foreach ($patch in Get-ChildItem "$env:GITHUB_WORKSPACE\.github\patches\mesa-*.patch" -ErrorAction SilentlyContinue) {
            Write-Host "Applying $($patch.Name)..."
            git apply --whitespace=nowarn $patch.FullName
            if ($LASTEXITCODE -ne 0) { throw "Failed to apply $($patch.Name)" }
          }

          # Meson cross file for MSVC targeting ARM64 Windows
          $crossFileContent = @"
          [binaries]
          c = 'cl'
          cpp = 'cl'
          ar = 'lib'
          windres = 'rc'

          [host_machine]
          system = 'windows'
          cpu_family = 'aarch64'
          cpu = 'aarch64'
          endian = 'little'
          "@
          Set-Content -Path "cross_arm64.txt" -Value $crossFileContent

          # Disable test_d3d10 in src/gallium/targets/d3d10umd/meson.build
          $d3d10Meson = "src/gallium/targets/d3d10umd/meson.build"
          if (Test-Path $d3d10Meson) {
            Write-Host "Disabling test_d3d10 in $d3d10Meson..."
            $content = Get-Content -Raw $d3d10Meson
            $content = $content -replace "if true\s+test\(\s+'d3d10'", "if false`n  test('d3d10'"
            Set-Content -Path $d3d10Meson -Value $content
          }

          Write-Host "Configuring Mesa with Meson..."
          # The virtio Vulkan driver (Venus) needs C11 <stdatomic.h>: /experimental:c11atomics.
          meson setup build-arm64 `
            --cross-file cross_arm64.txt `
            --prefix $mesaPrefix `
            -Dbuildtype=release `
            -Db_ndebug=true `
            -Dbuild-tests=false `
            -Dc_args="/wd4189 /experimental:c11atomics" `
            -Dcpp_args="/wd4189" `
            -Dgallium-drivers=virgl `
            -Dgallium-d3d10umd=true `
            -Dgallium-yttrium=true `
            -Dgallium-wgl-dll-name=viogpu_wgl `
            -Dgallium-d3d10-dll-name=viogpu_d3d10 `
            -Dvulkan-drivers=virtio `
            -Dzlib=disabled `
            -Dc_std=c11 `
            -Db_vscrt=mt

          Write-Host "Compiling and installing Mesa to $mesaPrefix..."
          ninja -C build-arm64 -k 0
          if ($LASTEXITCODE -ne 0) { throw "Mesa build failed" }
          ninja -C build-arm64 install
          if ($LASTEXITCODE -ne 0) { throw "Mesa install failed" }

          # Mesa installs the Venus driver as vulkan_virtio.dll; the package and
          # INF expect libvulkan_virtio.dll.
          $binDir = Join-Path $mesaPrefix "bin"
          $venusDll = Join-Path $binDir "vulkan_virtio.dll"
          if (-not (Test-Path $venusDll)) { throw "Mesa did not install vulkan_virtio.dll" }
          Copy-Item $venusDll (Join-Path $binDir "libvulkan_virtio.dll") -Force
          $icdDir = Join-Path $mesaPrefix "share\vulkan\icd.d"
          $icdJson = Join-Path $icdDir "virtio_icd.aarch64.json"
          if (-not (Test-Path $icdJson)) {
            New-Item -ItemType Directory -Path $icdDir -Force | Out-Null
            '{"file_format_version":"1.0.1","ICD":{"library_path":"..\\..\\..\\bin\\libvulkan_virtio.dll","api_version":"1.4.0"}}' |
              Set-Content -Path $icdJson -Encoding ascii
          }

          Write-Host "Mesa build complete. Installed files:"
          Get-ChildItem -Path $mesaPrefix -Recurse | Select-Object FullName

      - name: Build viogpu3d ARM64 driver
        shell: pwsh
        run: |
          Write-Host "MESA_PREFIX_ARM64 is: $env:MESA_PREFIX_ARM64"
          cd viogpu

          # Build viogpu3d.sln targeting Win11 Release for ARM64
          # Disable SDV / CodeQL analysis; use MSBuild directly
          msbuild viogpu3d.sln `
            /t:Build `
            /p:Configuration="Win11 Release" `
            /p:Platform=ARM64 `
            /p:MESA_PREFIX_ARM64="$env:MESA_PREFIX_ARM64" `
            /v:normal

      - name: Test-sign driver package
        shell: pwsh
        run: |
          $certPfx = Join-Path $env:GITHUB_WORKSPACE "build\VirtIOTestCert.pfx"
          $installDir = Join-Path $env:GITHUB_WORKSPACE "viogpu\Install\Win11\ARM64"

          if (-not (Test-Path $installDir)) {
            Write-Error "Install directory not found: $installDir"
            exit 1
          }

          Write-Host "Staged driver files in $($installDir):"
          Get-ChildItem -Path $installDir -Recurse | Select-Object FullName, Length

          if (Test-Path $certPfx) {
            Write-Host "Signing driver binaries and catalog with test certificate..."
            Get-ChildItem -Path $installDir -Recurse -Include *.sys, *.cat | ForEach-Object {
              Write-Host "Signing $($_.FullName)..."
              signtool sign /fd SHA256 /f $certPfx $_.FullName
              if ($LASTEXITCODE -ne 0) { throw "Failed to sign $($_.FullName)" }
            }
          } elseif ($env:PUBLISH -eq 'true') {
            Write-Error "Test certificate $certPfx not found; refusing to publish an unsigned package."
            exit 1
          } else {
            Write-Warning "Test certificate $certPfx not found, skipping sign step."
          }

          # Include test certificate in the driver folder for easy installation in the VM
          $certCer = Join-Path $env:GITHUB_WORKSPACE "build\VirtIOTestCert.cer"
          if (Test-Path $certCer) {
            Copy-Item $certCer -Destination $installDir -Force
          } elseif ($env:PUBLISH -eq 'true') {
            Write-Error "Test certificate $certCer not found; the release notes require it."
            exit 1
          }

      - name: Package driver artifact
        shell: pwsh
        run: |
          $installDir = Join-Path $env:GITHUB_WORKSPACE "viogpu\Install\Win11\ARM64"
          $zipPath = Join-Path $env:GITHUB_WORKSPACE "viogpu3d-arm64-win11.zip"

          Compress-Archive -Path "$installDir\*" -DestinationPath $zipPath -Force
          Write-Host "Created archive: $zipPath"

      - name: Upload driver artifact
        uses: actions/upload-artifact@v6
        with:
          name: viogpu3d-arm64-win11
          path: viogpu3d-arm64-win11.zip
          if-no-files-found: error

      - name: Create GitHub release
        if: env.PUBLISH == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $now = (Get-Date).ToUniversalTime()
          $stamp = $now.ToString("yyyyMMdd.HHmmss")
          $tag = "viogpu3d-arm64-$stamp"
          $zip = "viogpu3d-arm64-win11.zip"
          $sha256 = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()

          $notes = @(
            "Experimental VirtIO GPU 3D acceleration (viogpu3d) driver and Mesa UMD package for Windows 11 ARM64 guests. Test-signed, not for production use."
            ""
            "D3D10, WGL/OpenGL, GLES and Vulkan (Venus) are accelerated."
            ""
            "### Build"
            "- Built: $($now.ToString('yyyy-MM-dd HH:mm:ss')) UTC"
            "- yttrium-virtio-gpu: ``$env:GITHUB_SHA`` ($env:GITHUB_REF_NAME)"
            "- Mesa: ``$env:MESA_SHA`` ($env:MESA_REPO @ $env:MESA_REF)"
            "- ``$zip`` SHA-256: ``$sha256``"
            ""
            "### Guest setup"
            "1. Import ``VirtIOTestCert.cer`` into Trusted Root Certification Authorities (Local Machine)."
            "2. Enable test signing: ``bcdedit /set testsigning on``, then reboot."
            "3. Disable hibernation / Fast Startup: ``powercfg /hibernate off``."
            "4. Install: ``pnputil /add-driver viogpu3d.inf /install``."
          ) -join "`n"
          $notesFile = Join-Path $env:RUNNER_TEMP "release-notes.md"
          Set-Content -Path $notesFile -Value $notes -Encoding utf8

          $shaFile = "$zip.sha256"
          [IO.File]::WriteAllText((Join-Path $PWD $shaFile), "$sha256  $zip`n")

          gh release create $tag $zip $shaFile `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title "viogpu3d Win11 ARM64 ($stamp)" `
            --notes-file $notesFile `
            --latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "Published release $tag"
