name: Build viogpu3d ARM64 Driver

on:
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

env:
  DEFAULT_MESA_REPO: 'https://gitlab.freedesktop.org/miles.buckton/mesa'
  # Pinned so builds are reproducible; bump to pick up new Mesa work.
  DEFAULT_MESA_REF: '43ceec2d00de27baccfbc3f4de1127e776a5e65a'
  # Releases are published only from a manual run on master;
  # other runs only upload the build artifact.
  PUBLISH: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' }}

jobs:
  build-arm64:
    name: Build viogpu3d (Win11 ARM64)
    runs-on: windows-2022
    outputs:
      publish: ${{ env.PUBLISH }}
      mesa_repo: ${{ steps.mesa.outputs.mesa_repo }}
      mesa_ref: ${{ steps.mesa.outputs.mesa_ref }}
      mesa_sha: ${{ steps.mesa.outputs.mesa_sha }}
      arm64x: ${{ steps.package.outputs.arm64x }}

    steps:
      - name: Checkout kvm-guest-drivers-windows
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Meson and Ninja
        shell: pwsh
        run: |
          pip install meson==1.9.1 ninja==1.13.0 mako==1.3.10 pyyaml==6.0.3 packaging==25.0

      - name: Setup MSVC developer environment (ARM64 cross-compile)
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $before = @{}
          Get-ChildItem env: | ForEach-Object { $before[$_.Name] = $_.Value }
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvarsall.bat`" x64_arm64 >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$' -and $before[$matches[1]] -ne $matches[2]) {
              $name = if ($matches[1] -ieq 'Path') { 'PATH' } else { $matches[1] }
              "$name=$($matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Append
            }
          }

      - name: Install winflexbison
        shell: pwsh
        run: |
          choco install winflexbison3 -y --no-progress
          "C:\ProgramData\chocolatey\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Install Windows Driver Kit (WDK)
        shell: pwsh
        run: |
          # windows-2022 images ship a WDK matching their SDK; only install when absent
          # so the WDK and SDK versions are not mixed.
          $wdkBin = "C:\Program Files (x86)\Windows Kits\10\bin"
          $hasWdk = Get-ChildItem $wdkBin -Directory -ErrorAction SilentlyContinue |
            Where-Object { (Test-Path (Join-Path $_.FullName "x64\inf2cat.exe")) -or (Test-Path (Join-Path $_.FullName "x86\inf2cat.exe")) }
          if ($hasWdk) {
            Write-Host "WDK already installed: $($hasWdk.Name -join ', ')"
          } else {
            choco install windowsdriverkit10 -y --no-progress
          }

      - name: Discover Windows SDK and WDK headers
        shell: pwsh
        run: |
          $sdkInclude = "C:\Program Files (x86)\Windows Kits\10\Include"
          $sdkVersions = Get-ChildItem $sdkInclude -Directory | Sort-Object Name -Descending

          foreach ($ver in $sdkVersions) {
            $umPath = Join-Path $ver.FullName "um"
            $sharedPath = Join-Path $ver.FullName "shared"
            $d3d10Header = Join-Path $umPath "d3d10umddi.h"
            $d3dkmHeader = Join-Path $sharedPath "d3dkmddi.h"

            if ((Test-Path $d3d10Header) -and (Test-Path $d3dkmHeader)) {
              Write-Host "Found d3d10umddi.h in: $umPath"
              Write-Host "Found d3dkmddi.h in: $sharedPath"
              "WDK_INCLUDE=$umPath;$sharedPath" | Out-File -FilePath $env:GITHUB_ENV -Append
              exit 0
            }
          }

          Write-Error "Could not find required d3d10umddi.h or d3dkmddi.h in $sdkInclude"
          exit 1

      - name: Clone Mesa
        id: mesa
        shell: pwsh
        run: |
          $repo = $env:DEFAULT_MESA_REPO
          $ref = $env:DEFAULT_MESA_REF
          # fetch by ref so branches, tags and commit SHAs all work
          git init -q mesa-src
          git -C mesa-src remote add origin $repo
          git -C mesa-src fetch --depth 1 origin $ref
          if ($LASTEXITCODE -ne 0) { throw "Failed to fetch Mesa $ref from $repo" }
          git -C mesa-src checkout -q FETCH_HEAD
          $mesaSha = git -C mesa-src rev-parse HEAD
          "MESA_REPO=$repo" | Out-File -FilePath $env:GITHUB_ENV -Append
          "MESA_REF=$ref" | Out-File -FilePath $env:GITHUB_ENV -Append
          "MESA_SHA=$mesaSha" | Out-File -FilePath $env:GITHUB_ENV -Append
          "mesa_repo=$repo" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "mesa_ref=$ref" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "mesa_sha=$mesaSha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Configure and build Mesa (ARM64)
        shell: pwsh
        env:
          INCLUDE: ${{ env.WDK_INCLUDE }};${{ env.INCLUDE }}
        run: |
          $mesaPrefix = Join-Path $env:GITHUB_WORKSPACE "mesa_prefix_arm64"
          New-Item -ItemType Directory -Path $mesaPrefix -Force | Out-Null
          "MESA_PREFIX_ARM64=$mesaPrefix" | Out-File -FilePath $env:GITHUB_ENV -Append

          cd mesa-src
          foreach ($patch in Get-ChildItem "$env:GITHUB_WORKSPACE\.github\patches\mesa-*.patch" -ErrorAction SilentlyContinue) {
            Write-Host "Applying $($patch.Name)..."
            git apply --whitespace=nowarn $patch.FullName
            if ($LASTEXITCODE -ne 0) { throw "Failed to apply $($patch.Name)" }
          }

          # Meson cross file for MSVC targeting ARM64 Windows
          $crossFileContent = @"
          [binaries]
          c = 'cl'
          cpp = 'cl'
          ar = 'lib'
          windres = 'rc'

          [host_machine]
          system = 'windows'
          cpu_family = 'aarch64'
          cpu = 'aarch64'
          endian = 'little'
          "@
          Set-Content -Path "cross_arm64.txt" -Value $crossFileContent

          # Disable test_d3d10 in src/gallium/targets/d3d10umd/meson.build
          $d3d10Meson = "src/gallium/targets/d3d10umd/meson.build"
          if (Test-Path $d3d10Meson) {
            Write-Host "Disabling test_d3d10 in $d3d10Meson..."
            $content = Get-Content -Raw $d3d10Meson
            $pattern = "if true\s+test\(\s+'d3d10'"
            if ($content -notmatch $pattern) {
              Write-Error "test_d3d10 block not found in $d3d10Meson; update the pattern."
              exit 1
            }
            $content = $content -replace $pattern, "if false`n  test('d3d10'"
            Set-Content -Path $d3d10Meson -Value $content
          }

          Write-Host "Configuring Mesa with Meson..."
          # The virtio Vulkan driver (Venus) needs C11 <stdatomic.h>: /experimental:c11atomics.
          meson setup build-arm64 `
            --cross-file cross_arm64.txt `
            --prefix $mesaPrefix `
            -Dbuildtype=release `
            -Db_ndebug=true `
            -Dbuild-tests=false `
            -Dc_args="/wd4189 /experimental:c11atomics" `
            -Dcpp_args="/wd4189" `
            -Dgallium-drivers=virgl `
            -Dgallium-d3d10umd=true `
            -Dgallium-yttrium=true `
            -Dgallium-wgl-dll-name=viogpu_wgl `
            -Dgallium-d3d10-dll-name=viogpu_d3d10 `
            -Dvulkan-drivers=virtio `
            -Dzlib=disabled `
            -Dc_std=c11 `
            -Db_vscrt=mt

          Write-Host "Compiling and installing Mesa to $mesaPrefix..."
          ninja -C build-arm64 -k 0
          if ($LASTEXITCODE -ne 0) { throw "Mesa build failed" }
          ninja -C build-arm64 install
          if ($LASTEXITCODE -ne 0) { throw "Mesa install failed" }

          # Mesa installs the Venus driver as vulkan_virtio.dll; the package and
          # INF expect libvulkan_virtio.dll.
          $binDir = Join-Path $mesaPrefix "bin"
          $venusDll = Join-Path $binDir "vulkan_virtio.dll"
          if (-not (Test-Path $venusDll)) { throw "Mesa did not install vulkan_virtio.dll" }
          Copy-Item $venusDll (Join-Path $binDir "libvulkan_virtio.dll") -Force
          $icdDir = Join-Path $mesaPrefix "share\vulkan\icd.d"
          $icdJson = Join-Path $icdDir "virtio_icd.aarch64.json"
          if (-not (Test-Path $icdJson)) {
            New-Item -ItemType Directory -Path $icdDir -Force | Out-Null
            '{"file_format_version":"1.0.1","ICD":{"library_path":"..\\..\\..\\bin\\libvulkan_virtio.dll","api_version":"1.4.0"}}' |
              Set-Content -Path $icdJson -Encoding ascii
          }

          Write-Host "Mesa build complete. Installed files:"
          Get-ChildItem -Path $mesaPrefix -Recurse | Select-Object FullName

      # The ARM64EC Mesa build and the ARM64X assembly add user-mode drivers
      # that x64-emulated apps can load. Both are best effort: if either
      # fails, MESA_ARM64X_DIR stays unset and the native ARM64 package is
      # built and published exactly as before.
      - name: Configure and build Mesa (ARM64EC)
        id: mesa_ec
        continue-on-error: true
        shell: pwsh
        env:
          INCLUDE: ${{ env.WDK_INCLUDE }};${{ env.INCLUDE }}
        run: |
          # ARM64EC links against the same lib\arm64 directories as ARM64: with
          # the ARM64EC build tools installed, the MSVC arm64 libraries carry
          # ARM64EC objects as well (lib\arm64ec is empty). Probe a tiny link
          # and install the component if the runner image lacks it.
          $probeDir = Join-Path $env:RUNNER_TEMP "arm64ec_probe"
          New-Item -ItemType Directory -Path $probeDir -Force | Out-Null
          Set-Content -Path "$probeDir\probe.c" -Value 'int main(void) { return 0; }'
          function Test-Arm64EcLink {
            & cl /nologo /arm64EC /MT "/Fo$probeDir\probe.obj" "/Fe$probeDir\probe.exe" "$probeDir\probe.c" /link /machine:arm64ec 2>&1 | Write-Host
            return ($LASTEXITCODE -eq 0)
          }
          if (-not (Test-Arm64EcLink)) {
            Write-Host "ARM64EC link probe failed; installing the MSVC ARM64EC build tools..."
            $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
            $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"
            $p = Start-Process -FilePath $installer -Wait -PassThru -ArgumentList @(
              'modify', '--installPath', "`"$vsPath`"",
              '--add', 'Microsoft.VisualStudio.Component.VC.Tools.ARM64EC',
              '--quiet', '--norestart', '--nocache')
            Write-Host "vs_installer exit code: $($p.ExitCode)"
            if (-not (Test-Arm64EcLink)) { throw "ARM64EC link probe still fails after installing the ARM64EC build tools" }
          }
          Write-Host "ARM64EC link probe OK"

          cd mesa-src
          # ARM64EC-only Mesa fixes; kept apart from .github/patches/mesa-*.patch
          # so they can never break the native ARM64 build.
          foreach ($patch in Get-ChildItem "$env:GITHUB_WORKSPACE\.github\patches\arm64ec\mesa-*.patch" -ErrorAction SilentlyContinue) {
            Write-Host "Applying $($patch.Name)..."
            git apply --ignore-whitespace --whitespace=nowarn $patch.FullName
            if ($LASTEXITCODE -ne 0) { throw "Failed to apply $($patch.Name)" }
          }

          # Meson has no ARM64EC support: build with the ARM64 cross cl plus
          # /arm64EC, and run link/lib through a wrapper that turns the
          # /MACHINE:ARM64 meson always passes into /MACHINE:ARM64EC.
          $python = (Get-Command python).Source -replace '\\', '/'
          $wrapper = (Join-Path $env:GITHUB_WORKSPACE 'viogpu\viogpu3d\tools\arm64x\msvc_arm64ec_wrap.py') -replace '\\', '/'
          $crossFileContent = @"
          [binaries]
          c = ['cl', '/arm64EC']
          cpp = ['cl', '/arm64EC']
          c_ld = ['$python', '$wrapper', 'link']
          cpp_ld = ['$python', '$wrapper', 'link']
          ar = ['$python', '$wrapper', 'lib']
          windres = 'rc'

          [host_machine]
          system = 'windows'
          cpu_family = 'aarch64'
          cpu = 'arm64ec'
          endian = 'little'
          "@
          Set-Content -Path "cross_arm64ec.txt" -Value $crossFileContent
          Get-Content cross_arm64ec.txt

          # x64 SSE intrinsics without a native ARM64EC mapping resolve from
          # softintrin.lib.
          $linkArgs = @()
          $softintrin = $env:LIB -split ';' | Where-Object { $_ -and (Test-Path (Join-Path $_ 'softintrin.lib')) } | Select-Object -First 1
          if ($softintrin) {
            $linkArgs = @('-Dc_link_args=softintrin.lib', '-Dcpp_link_args=softintrin.lib')
          }

          # Only the D3D UMD, the WGL ICD and the Venus ICD are needed; LLVM,
          # EGL and GLES stay native-only.
          meson setup build-arm64ec `
            --cross-file cross_arm64ec.txt `
            --prefix (Join-Path $env:GITHUB_WORKSPACE "mesa_prefix_arm64ec") `
            -Dbuildtype=release `
            -Db_ndebug=true `
            -Dbuild-tests=false `
            -Dc_args="/wd4189 /experimental:c11atomics" `
            -Dcpp_args="/wd4189" `
            @linkArgs `
            -Dgallium-drivers=virgl `
            -Dgallium-d3d10umd=true `
            -Dgallium-yttrium=true `
            -Dgallium-wgl-dll-name=viogpu_wgl `
            -Dgallium-d3d10-dll-name=viogpu_d3d10 `
            -Dvulkan-drivers=virtio `
            -Dllvm=disabled `
            -Degl=disabled `
            -Dgles1=disabled `
            -Dgles2=disabled `
            -Dzlib=disabled `
            -Dc_std=c11 `
            -Db_vscrt=mt
          if ($LASTEXITCODE -ne 0) { throw "Mesa ARM64EC configure failed" }

          ninja -C build-arm64ec -k 0
          $ninjaExit = $LASTEXITCODE

          # Collect the three DLLs straight from the build tree, under the
          # names the native Mesa install uses.
          $ecBin = Join-Path $env:GITHUB_WORKSPACE "mesa_arm64ec_bin"
          New-Item -ItemType Directory -Path $ecBin -Force | Out-Null
          $wanted = [ordered]@{
            'viogpu_d3d10.dll'  = 'viogpu_d3d10.dll'
            'viogpu_wgl.dll'    = 'viogpu_wgl.dll'
            'vulkan_virtio.dll' = 'libvulkan_virtio.dll'
          }
          foreach ($name in $wanted.Keys) {
            $found = @(Get-ChildItem -Path build-arm64ec -Recurse -File -Filter $name | Where-Object { $_.Name -eq $name })
            if ($found.Count -ne 1) {
              throw "Expected one $name in build-arm64ec, found $($found.Count) (ninja exit code $ninjaExit)"
            }
            Copy-Item $found[0].FullName (Join-Path $ecBin $wanted[$name]) -Force
            Write-Host "$($found[0].FullName) -> $($wanted[$name])"
            dumpbin /nologo /headers $found[0].FullName | Select-String -Pattern 'machine \('
          }
          if ($ninjaExit -ne 0) {
            Write-Host "::warning::Some ARM64EC Mesa targets failed to build (ninja exit code $ninjaExit); the ARM64X user-mode drivers were built anyway."
          }

          "MESA_ARM64EC_BIN=$ecBin" | Out-File -FilePath $env:GITHUB_ENV -Append
          exit 0

      - name: Assemble ARM64X user-mode drivers
        id: arm64x
        if: steps.mesa_ec.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          $outDir = Join-Path $env:GITHUB_WORKSPACE "mesa_arm64x"
          & "$env:GITHUB_WORKSPACE\viogpu\viogpu3d\tools\arm64x\make_arm64x.ps1" `
            -NativeDir (Join-Path $env:MESA_PREFIX_ARM64 "bin") `
            -EcDir $env:MESA_ARM64EC_BIN `
            -OutDir $outDir
          "MESA_ARM64X_DIR=$outDir" | Out-File -FilePath $env:GITHUB_ENV -Append
          exit 0

      - name: Build viogpu3d ARM64 driver
        shell: pwsh
        run: |
          Write-Host "MESA_PREFIX_ARM64 is: $env:MESA_PREFIX_ARM64"
          cd viogpu

          # Build viogpu3d.sln targeting Win11 Release for ARM64
          # Disable SDV / CodeQL analysis; use MSBuild directly
          $msbuildArgs = @(
            '/t:Build'
            '/p:Configuration=Win11 Release'
            '/p:Platform=ARM64'
            "/p:MESA_PREFIX_ARM64=$env:MESA_PREFIX_ARM64"
            '/v:normal'
          )
          if ($env:MESA_ARM64X_DIR) {
            Write-Host "MESA_ARM64X_DIR is: $env:MESA_ARM64X_DIR"
            msbuild viogpu3d.sln @msbuildArgs "/p:MESA_ARM64X_DIR=$env:MESA_ARM64X_DIR"
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Host "::warning::The build with ARM64X user-mode drivers failed; rebuilding the native ARM64 package without them."
          } else {
            Write-Host "::warning::ARM64X user-mode drivers are unavailable (see the ARM64EC Mesa and ARM64X assembly steps); packaging native ARM64 user-mode drivers only, which x64-emulated apps cannot load."
          }
          msbuild viogpu3d.sln @msbuildArgs
          exit $LASTEXITCODE

      - name: Test-sign driver package
        shell: pwsh
        run: |
          $certPfx = Join-Path $env:GITHUB_WORKSPACE "build\VirtIOTestCert.pfx"
          $installDir = Join-Path $env:GITHUB_WORKSPACE "viogpu\Install\Win11\ARM64"

          if (-not (Test-Path $installDir)) {
            Write-Error "Install directory not found: $installDir"
            exit 1
          }

          Write-Host "Staged driver files in $($installDir):"
          Get-ChildItem -Path $installDir -Recurse | Select-Object FullName, Length

          if (Test-Path $certPfx) {
            Write-Host "Signing driver binaries and catalog with test certificate..."
            Get-ChildItem -Path $installDir -Recurse -Include *.sys, *.cat | ForEach-Object {
              Write-Host "Signing $($_.FullName)..."
              signtool sign /fd SHA256 /f $certPfx $_.FullName
              if ($LASTEXITCODE -ne 0) { throw "Failed to sign $($_.FullName)" }
            }
          } elseif ($env:PUBLISH -eq 'true') {
            Write-Error "Test certificate $certPfx not found; refusing to publish an unsigned package."
            exit 1
          } else {
            Write-Warning "Test certificate $certPfx not found, skipping sign step."
          }

          # Include test certificate in the driver folder for easy installation in the VM
          $certCer = Join-Path $env:GITHUB_WORKSPACE "build\VirtIOTestCert.cer"
          if (Test-Path $certCer) {
            Copy-Item $certCer -Destination $installDir -Force
          } elseif ($env:PUBLISH -eq 'true') {
            Write-Error "Test certificate $certCer not found; the release notes require it."
            exit 1
          }

      - name: Package driver artifact
        id: package
        shell: pwsh
        run: |
          $installDir = Join-Path $env:GITHUB_WORKSPACE "viogpu\Install\Win11\ARM64"
          $zipPath = Join-Path $env:GITHUB_WORKSPACE "viogpu3d-arm64-win11.zip"

          # Report ARM64X only when the package really carries it.
          $arm64x = (Test-Path (Join-Path $installDir "arm64\viogpu_d3d10_arm64x.dll")) -and
            [bool](Get-ChildItem -Path $installDir -Filter *.inf | Select-String -SimpleMatch 'viogpu_d3d10_arm64x.dll' -Quiet)
          if ($arm64x) {
            Write-Host "Package includes ARM64X user-mode drivers for x64-emulated apps."
          } else {
            Write-Host "::warning::Package has native ARM64 user-mode drivers only (no ARM64X)."
          }
          "arm64x=$($arm64x.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

          Compress-Archive -Path "$installDir\*" -DestinationPath $zipPath -Force
          Write-Host "Created archive: $zipPath"

      - name: Upload driver artifact
        uses: actions/upload-artifact@v6
        with:
          name: viogpu3d-arm64-win11
          path: viogpu3d-arm64-win11.zip
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build-arm64
    if: needs.build-arm64.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download driver artifact
        uses: actions/download-artifact@v7
        with:
          name: viogpu3d-arm64-win11

      - name: Create GitHub release
        id: create
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MESA_REPO: ${{ needs.build-arm64.outputs.mesa_repo }}
          MESA_REF: ${{ needs.build-arm64.outputs.mesa_ref }}
          MESA_SHA: ${{ needs.build-arm64.outputs.mesa_sha }}
          ARM64X: ${{ needs.build-arm64.outputs.arm64x }}
        run: |
          $now = (Get-Date).ToUniversalTime()
          $stamp = $now.ToString("yyyyMMdd.HHmmss")
          $tag = "viogpu3d-arm64-$stamp"
          $zip = "viogpu3d-arm64-win11.zip"
          $sha256 = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          $appSupport = if ($env:ARM64X -eq 'true') {
            "x64-emulated apps can load the user-mode drivers too: the D3D UMD, WGL ICD and Vulkan ICD ship as ARM64X DLLs with arm64 and arm64ec builds."
          } else {
            "Native ARM64 apps only: this build has no ARM64X user-mode drivers, so x64-emulated apps are not accelerated."
          }

          $notes = @(
            "Experimental VirtIO GPU 3D acceleration (viogpu3d) driver and Mesa UMD package for Windows 11 ARM64 guests. Test-signed, not for production use."
            ""
            "D3D10, WGL/OpenGL, GLES and Vulkan (Venus) are accelerated."
            ""
            $appSupport
            ""
            "### Build"
            "- Built: $($now.ToString('yyyy-MM-dd HH:mm:ss')) UTC"
            "- kvm-guest-drivers-windows: ``$env:GITHUB_SHA`` ($env:GITHUB_REF_NAME)"
            "- Mesa: ``$env:MESA_SHA`` ($env:MESA_REPO @ $env:MESA_REF)"
            "- ``$zip`` SHA-256: ``$sha256``"
            ""
            "### Guest setup"
            "1. Import ``VirtIOTestCert.cer`` into Trusted Root Certification Authorities (Local Machine). Its private key is public, so anything signed with it is trusted: only do this in disposable test VMs."
            "2. Enable test signing: ``bcdedit /set testsigning on``, then reboot."
            "3. Disable hibernation / Fast Startup: ``powercfg /hibernate off``."
            "4. Install: ``pnputil /add-driver viogpu3d.inf /install``."
          ) -join "`n"
          $notesFile = Join-Path $env:RUNNER_TEMP "release-notes.md"
          Set-Content -Path $notesFile -Value $notes -Encoding utf8

          $shaFile = "$zip.sha256"
          [IO.File]::WriteAllText((Join-Path $PWD $shaFile), "$sha256  $zip`n")

          gh release create $tag $zip $shaFile `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title "viogpu3d Win11 ARM64 ($stamp)" `
            --notes-file $notesFile `
            --latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "Published release $tag"
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      # Only the newest release is kept. Pruning runs after the new release
      # exists, so a failed publish never leaves the repository without one.
      - name: Prune previous releases and tags
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_TAG: ${{ steps.create.outputs.tag }}
        run: |
          if (-not $env:NEW_TAG) { throw "New release tag is unknown; refusing to prune." }

          $releases = gh release list --repo $env:GITHUB_REPOSITORY --limit 1000 --json tagName | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "Failed to list releases" }
          foreach ($rel in $releases | Where-Object { $_.tagName -like 'viogpu3d-arm64-*' -and $_.tagName -ne $env:NEW_TAG }) {
            Write-Host "Deleting release $($rel.tagName)..."
            gh release delete $rel.tagName --repo $env:GITHUB_REPOSITORY --cleanup-tag --yes
            if ($LASTEXITCODE -ne 0) { throw "Failed to delete release $($rel.tagName)" }
          }

          # Tags left behind without a release (for example by a failed run).
          $refs = gh api --paginate "repos/$env:GITHUB_REPOSITORY/git/matching-refs/tags/viogpu3d-arm64-" --jq '.[].ref'
          if ($LASTEXITCODE -ne 0) { throw "Failed to list tags" }
          foreach ($ref in $refs | Where-Object { $_ -and $_ -ne "refs/tags/$env:NEW_TAG" }) {
            Write-Host "Deleting orphan $ref..."
            gh api -X DELETE "repos/$env:GITHUB_REPOSITORY/git/$ref"
            if ($LASTEXITCODE -ne 0) { throw "Failed to delete $ref" }
          }
